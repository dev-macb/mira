server {
    listen 80;
    listen [::]:80;
    server_name mira.macb.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://mira.macb.tech$request_uri;
    }
}

upstream mira_http {
    zone mira_http 64k;
    server mira-http:6002 resolve;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mira.macb.tech;

    ssl_certificate /etc/letsencrypt/live/mira.macb.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mira.macb.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    include /etc/nginx/snippets/proxy.conf;

    location /api/ {
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://mira_http;
    }

    location / {
        proxy_pass http://mira_http;
    }
}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  http:
    build:
      context: .
      target: http
    environment:
      MIRA_JWT_SECRET: ${MIRA_JWT_SECRET:?Defina o segredo de assinatura JWT}
      MIRA_ADMIN_NAME: ${MIRA_ADMIN_NAME:-Administrador}
      MIRA_ADMIN_EMAIL: ${MIRA_ADMIN_EMAIL:?Defina o e-mail do administrador inicial}
      MIRA_ADMIN_PASSWORD: ${MIRA_ADMIN_PASSWORD:?Defina a senha do administrador inicial}
      MIRA_DOCKER_URL: http://docker-inventory:8080
      MIRA_DOCKER_TOKEN: ${MIRA_DOCKER_TOKEN:?Defina o token privado do inventário}
    volumes:
      - type: bind
        source: /srv/data/mira
        target: /srv/data/mira
        bind:
          create_host_path: false
    networks:
      private:
      proxy:
        aliases:
          - mira-http
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, -T, '4', 'http://127.0.0.1:6002/api/saude']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

  docker-inventory:
    build:
      context: .
      target: docker-inventory
    environment:
      MIRA_DOCKER_TOKEN: ${MIRA_DOCKER_TOKEN:?Defina o token privado do inventário}
    group_add:
      - ${MIRA_DOCKER_GID:?Informe o GID do socket Docker}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - private
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging

networks:
  private:
    internal: true
  proxy:
    external: true
    name: proxy
